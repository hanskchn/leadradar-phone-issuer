<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="签发器">
  <title>手机签发器</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="./manifest.webmanifest">
  <style>
    :root {
      --bg: #0b1020;
      --card: #151b2e;
      --line: #263149;
      --text: #e8edf7;
      --muted: #9aa7bd;
      --ok: #22c55e;
      --fail: #ef4444;
      --warn: #f59e0b;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
    body {
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      padding: calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));
      max-width: 720px;
      margin: 0 auto;
      -webkit-text-size-adjust: 100%;
    }
    [hidden] { display: none !important; }
    h1 { font-size: 20px; margin: 0 0 2px; letter-spacing: .5px; }
    h2 { font-size: 15px; margin: 0 0 10px; }
    p { margin: 6px 0; }
    a { color: var(--accent); }
    .muted { color: var(--muted); font-size: 13px; }
    .detail { color: var(--muted); font-size: 13px; word-break: break-all; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px; margin: 12px 0;
    }
    .card-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-head h2 { margin: 0; }
    button {
      font: inherit; color: var(--text); background: #1d2740;
      border: 1px solid var(--line); border-radius: 11px;
      padding: 10px 14px; min-height: 44px; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.ghost { background: transparent; }
    button.wide { width: 100%; }
    button:disabled { opacity: .55; }
    button.chip {
      min-height: 40px; padding: 8px 12px; border-radius: 999px;
      background: #1d2740; color: var(--text); font-size: 14px;
    }
    button.chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .badge {
      font-size: 12px; padding: 3px 9px; border-radius: 999px;
      background: #1d2740; border: 1px solid var(--line); color: var(--muted);
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .field { margin: 12px 0; }
    .field-label { font-size: 13px; color: var(--muted); margin-bottom: 7px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    input {
      font: inherit; font-size: 16px; color: var(--text);
      background: #0f172a; border: 1px solid var(--line);
      border-radius: 10px; padding: 11px 12px; min-height: 44px;
      width: 100%;
    }
    .row > input { flex: 1; min-width: 0; }
    input[type=number] { width: 110px; }
    input[type=date] { width: 100%; }
    .mono, textarea { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    textarea {
      width: 100%; margin-top: 10px; padding: 10px; border-radius: 10px;
      background: #0f172a; border: 1px solid var(--line); color: var(--text);
      font-size: 12px; line-height: 1.45; word-break: break-all; resize: vertical;
    }
    .expiry { font-weight: 600; margin-top: 10px; }
    .expiry.bad { color: var(--warn); }
    .history { list-style: none; padding: 0; margin: 10px 0 0; }
    .issue { padding: 10px 0; border-top: 1px solid var(--line); }
    .issue:first-child { border-top: 0; }
    .issue-top { font-size: 14px; font-weight: 600; }
    .issue-sub { font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
    .offline {
      display: none; position: sticky; top: 0; z-index: 9;
      margin: -14px -14px 10px; padding: 9px 14px;
      background: #78350f; color: #fde68a; font-size: 13px; font-weight: 600;
      padding-top: calc(9px + env(safe-area-inset-top));
    }
    .offline.show { display: block; }
    .toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      background: #1d2740; border: 1px solid var(--line); color: var(--text);
      padding: 10px 16px; border-radius: 999px; font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 20; max-width: 88vw;
    }
  </style>
</head>
<body>
  <div class="offline" id="offlineBar">离线条：已断网，签名仍可用（钥匙包在本机）</div>

  <header>
    <div>
      <h1>手机签发器</h1>
      <p class="muted">只在本机签名，钥匙包不出手机</p>
    </div>
    <div class="header-right">
      <span class="badge" id="lockState">已锁定</span>
      <button id="lockBtn" class="ghost" hidden>锁定</button>
    </div>
  </header>

  <main>
    <section id="lockScreen" class="card">
      <h2 id="lockTitle">输入口令解锁</h2>
      <p class="muted" id="lockHint"></p>
      <div id="importRow" hidden>
        <button id="importBtn" class="primary wide">导入钥匙包</button>
        <p class="muted">选手机「文件」里的 phone-keys.json。钥匙包只有密文，不含明文私钥。</p>
      </div>
      <div id="unlockRow" hidden>
        <input type="password" id="passphrase" placeholder="手机签发口令"
               autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button id="unlockBtn" class="primary wide" style="margin-top:10px">解锁</button>
      </div>
      <p class="detail" id="lockMsg"></p>
      <p class="detail" id="bundleInfo"></p>
    </section>

    <section id="appScreen" hidden>
      <div class="card">
        <h2>签一张离线激活码</h2>
        <div class="field">
          <div class="field-label">产品</div>
          <div class="chips" id="productChips"></div>
        </div>
        <div class="field">
          <div class="field-label">对方机器码</div>
          <div class="row">
            <input id="machine" class="mono" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX"
                   autocapitalize="characters" autocorrect="off" spellcheck="false">
            <button id="pasteBtn">粘贴</button>
          </div>
          <p class="detail" id="machineMsg"></p>
        </div>
        <div class="field">
          <div class="field-label">有效期</div>
          <div class="chips" id="durationChips"></div>
          <div class="row" id="customDaysRow" hidden style="margin-top:8px">
            <input type="number" id="customDays" min="1" max="3650" inputmode="numeric" value="30">
            <span class="muted">天</span>
          </div>
          <div class="row" id="dateRow" hidden style="margin-top:8px">
            <input type="date" id="expiryDate">
          </div>
          <p class="expiry" id="expiryPreview"></p>
          <p class="detail" id="phoneTime"></p>
        </div>
        <button id="issueBtn" class="primary wide">生成激活码</button>
        <p class="detail">短码仅 2026-09-28 之后的客户端可用；更早的客户端请用 PC 发卡台的离线激活码（长码）。</p>
        <p class="detail" id="issueMsg"></p>
        <div id="resultBox" hidden>
          <textarea id="resultCode" readonly rows="4"></textarea>
          <button id="copyCode" class="primary wide" style="margin-top:8px">复制激活码</button>
          <p class="detail">发给客户时只发这一串，不要带说明文字；让客户整条复制。</p>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>本机签发记录</h2>
          <button id="copyLedger">复制全部补记</button>
        </div>
        <ul id="history" class="history"></ul>
        <p class="detail" id="historyMsg"></p>
      </div>

      <div class="card">
        <h2>设置</h2>
        <div class="row">
          <button id="changeBundle">更换钥匙包</button>
          <button id="deleteBundle">删除本机钥匙包</button>
          <a href="./selfcheck.html">自检页</a>
        </div>
        <p class="detail" id="settingsMsg"></p>
      </div>
    </section>
  </main>

  <input type="file" id="bundleFile" accept=".json,application/json" hidden>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
